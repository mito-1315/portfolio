<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <!-- Fonts load in parallel with the page instead of through a CSS @import chain. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Apply a saved colour theme before the first paint, so it never flashes. -->
    <script>
      try {
        var theme = localStorage.getItem("portfolio-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <title>Mithesh Tharun S — Full Stack Developer</title>
      <meta
        name="description"
        content="The personal portfolio of Mithesh Tharun S. An experiment in sound, software and creativity."
      />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
